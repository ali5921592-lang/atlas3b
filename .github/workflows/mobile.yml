name: Mobile builds
on:
  workflow_dispatch:
    inputs:
      build_signed_android:
        description: Build an upload-key-signed Android App Bundle
        type: boolean
        required: true
        default: false
      build_signed_ipa:
        description: Build an App Store-signed IPA
        type: boolean
        required: true
        default: false
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - run: npm run android:build
      - run: python3 scripts/check-android-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-NOT-FOR-PLAY
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run native:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/App/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-not-ipa
          if-no-files-found: error
          path: ios/App/DerivedData/Build/Products/Debug-iphonesimulator/App.app
  android-play-release:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_signed_android) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/anatomy-release-prep')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_UPLOAD_STORE_PASSWORD" && test -n "$ANDROID_UPLOAD_KEY_ALIAS" && test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anatomi-upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/anatomi-upload.jks" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Build signed Android App Bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: npm run android:build
      - run: python3 scripts/check-android-assets.py
      - name: Verify signed App Bundle
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" > "$RUNNER_TEMP/aab-signature-check.log" 2>&1
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-signature-check.log"
          echo 'Signed Android App Bundle verified.'
          cp "$bundle" "$RUNNER_TEMP/insan-atlasi-3b-v3-play-signed.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: PLAY-CONSOLE-UPLOAD-SIGNED-AAB
          if-no-files-found: error
          path: ${{ runner.temp }}/insan-atlasi-3b-v3-play-signed.aab
  ios-app-store-ipa:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Apple distribution certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" && test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" && test -n "$IOS_APP_STORE_PROFILE_BASE64" && test -n "$IOS_TEAM_ID"
          security create-keychain -p "$RUNNER_TEMP/keychain-password" "$RUNNER_TEMP/anatomi.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/anatomi.keychain-db"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" "$RUNNER_TEMP/anatomi.keychain-db"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/anatomi.keychain-db" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP/keychain-password" "$RUNNER_TEMP/anatomi.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/anatomi.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/anatomi.keychain-db"
          echo "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$RUNNER_TEMP/anatomi.keychain-db" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Archive App Store build
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos
          -archivePath "$RUNNER_TEMP/AnatomiAtlas.xcarchive" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          IOS_PROFILE_UUID="$IOS_PROFILE_UUID" IOS_TEAM_ID="$IOS_TEAM_ID"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>com.anatomiatlasi.app</key><string>$IOS_PROFILE_UUID</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AnatomiAtlas.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: anatomi-atlasi-app-store-ipa
          if-no-files-found: error
          path: ${{ runner.temp }}/ipa/*.ipa
      - name: Upload IPA to App Store Connect
        env:
          IOS_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
          IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          test -n "$IOS_APP_STORE_CONNECT_API_KEY_ID" && test -n "$IOS_APP_STORE_CONNECT_ISSUER_ID" && test -n "$IOS_APP_STORE_CONNECT_API_KEY_P8"
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s\n' "$IOS_APP_STORE_CONNECT_API_KEY_P8" > "$key_dir/AuthKey_${IOS_APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${IOS_APP_STORE_CONNECT_API_KEY_ID}.p8"
          ipa="$RUNNER_TEMP/ipa/App.ipa"
          test -f "$ipa"
          xcrun altool --validate-app -f "$ipa" -t ios --apiKey "$IOS_APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$IOS_APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$IOS_APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$IOS_APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove temporary Apple API key
        if: always()
        env:
          IOS_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -n "$IOS_APP_STORE_CONNECT_API_KEY_ID" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_APP_STORE_CONNECT_API_KEY_ID}.p8"
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$IOS_KEYCHAIN_PATH" || true
